<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>FER 人脸表情识别 · 项目讲解动画</title>
<!--
  项目讲解动画（单文件，离线可用）
  - 动画库：GSAP 3（已内嵌，无需联网）
  - 操作：← / → 切换章节，空格 暂停/继续，R 重播本章，N 显示/隐藏讲稿
  - 结构：每一章 = 左边一个动画舞台 + 右边讲稿（怎么讲 / 代码在哪 / 可能被问）
  - 所有数字来自项目的 reports/ 与 runs/，标“示意”的除外
-->
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#faf9f5; --panel:#f3f1ea; --card:#ffffff; --line:#e6e2d8;
  --ink:#1f1e1d; --ink2:#5e5d59; --ink3:#8f8c84;
  --clay:#d97757; --clay2:#c96442; --clay-soft:#f6e3da;
  --sage:#7a8f6a; --sky:#6a8caf; --sand:#c9a96e;
  --serif:"Source Serif 4","Songti SC","Noto Serif SC","STSong","SimSun",Georgia,serif;
  --sans:"DM Sans","PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --mono:"JetBrains Mono","Cascadia Code",Consolas,monospace;
}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden}
.app{display:grid;grid-template-columns:1fr 400px;grid-template-rows:56px 1fr 52px;height:100vh}
.app.no-notes{grid-template-columns:1fr 0}
header{grid-column:1/3;display:flex;align-items:center;gap:14px;padding:0 24px;border-bottom:1px solid var(--line)}
header .mark{color:var(--clay);font-size:22px}
header h1{font-family:var(--serif);font-weight:600;font-size:18px}
header .chap{margin-left:auto;color:var(--ink2);font-size:14px}
main{position:relative;overflow:hidden}
aside{border-left:1px solid var(--line);background:var(--panel);overflow-y:auto;padding:22px 22px 30px}
.app.no-notes aside{display:none}
aside h2{font-family:var(--serif);font-size:20px;margin-bottom:14px;line-height:1.3}
aside h3{font-size:12px;letter-spacing:.08em;color:var(--clay2);margin:18px 0 6px;font-weight:600}
aside p,aside li{font-size:14.5px;line-height:1.7;color:var(--ink)}
aside ul{padding-left:18px}
aside code{word-break:break-all;font-family:var(--mono);font-size:12.5px;background:#ebe7dc;padding:1px 5px;border-radius:4px}
aside details{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-top:8px}
aside summary{cursor:pointer;font-size:14px;font-weight:600}
aside details p{margin-top:6px;color:var(--ink2);font-size:14px}
aside .plain{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--clay);border-radius:10px;padding:10px 12px;margin-top:6px}
aside .plain li{margin:4px 0;font-size:13.8px;line-height:1.6}
footer{grid-column:1/3;display:flex;align-items:center;gap:14px;padding:0 24px;border-top:1px solid var(--line)}
footer button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;height:32px;min-width:36px;padding:0 10px;font:inherit;font-size:14px;cursor:pointer}
footer button:hover{border-color:var(--clay)}
footer button:focus-visible,input:focus-visible{outline:2px solid var(--clay);outline-offset:2px}
.dots{display:flex;gap:6px}
.dots button{min-width:10px;width:10px;height:10px;padding:0;border-radius:50%;background:var(--line);border:none}
.dots button.on{background:var(--clay);width:22px;border-radius:5px}
#scrub{flex:1;accent-color:var(--clay)}
.hint{color:var(--ink3);font-size:12px;white-space:nowrap}

/* 舞台：固定 1280x720 坐标系，按比例缩放 */
.stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:center}
.scene{position:absolute;inset:0;visibility:hidden}
.scene.on{visibility:visible}
.t-hero{font-family:var(--serif);font-size:64px;font-weight:600;line-height:1.15}
.t-title{font-family:var(--serif);font-size:38px;font-weight:600}
.t-sub{font-size:20px;color:var(--ink2)}
.lbl{font-size:16px;color:var(--ink2)}
.abs{position:absolute}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px}
.px{image-rendering:pixelated;border-radius:6px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:17px;white-space:nowrap}
.chip.hot{background:var(--clay);color:#fff;border-color:var(--clay)}
.mono{font-family:var(--mono)}
.num{font-family:var(--serif);font-variant-numeric:tabular-nums}
.clay{color:var(--clay2)}
.tag{font-size:13px;color:#fff;background:var(--ink);padding:3px 8px;border-radius:6px}
svg text{font-family:var(--sans)}
.bar{position:absolute;bottom:0;border-radius:6px 6px 0 0;background:var(--ink2)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>
/* ============================================================
   移动端 / 窄窗口与横屏适配层
   桌面端（>900px 且非矮横屏）完全保持 base.css 原样。
   ============================================================ */

#notesBackdrop {
  display: none;
}

@media (max-width: 900px), (max-height: 520px) and (orientation: landscape) {
  .app,
  .app.no-notes {
    grid-template-columns: minmax(0, 1fr);
    width: 100%;
    height: 100vh;
    height: 100dvh;
  }

  header,
  main,
  aside,
  footer {
    grid-column: 1;
    min-width: 0;
  }

  body {
    overflow-wrap: break-word;
    overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  main {
    touch-action: pan-y;
    -webkit-user-select: none;
    user-select: none;
  }

  aside h2,
  aside h3 {
    text-wrap: balance;
  }

  aside p,
  aside li {
    text-wrap: pretty;
  }

  aside code {
    overflow-wrap: anywhere;
    word-break: normal;
  }

  header {
    min-height: 46px;
    height: auto;
    padding: max(6px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) 6px max(12px, env(safe-area-inset-left, 0px));
    gap: 6px 10px;
    flex-wrap: wrap;
  }

  header .mark {
    font-size: 18px;
  }

  header h1 {
    font-size: 15px;
  }

  header .chap {
    font-size: 12px;
    min-width: 0;
  }

  footer {
    padding: 6px max(10px, env(safe-area-inset-right, 0px)) max(8px, env(safe-area-inset-bottom, 0px)) max(10px, env(safe-area-inset-left, 0px));
    gap: 6px;
    min-height: 48px;
    height: auto;
  }

  footer button {
    min-width: 38px;
    min-height: 38px;
    height: auto;
    padding: 0 8px;
    flex-shrink: 0;
  }

  #scrub {
    flex: 1 1 56px;
    min-width: 48px;
    min-height: 36px;
  }

  .hint {
    display: none;
  }
}

@media (max-width: 900px) and (pointer: coarse) {
  footer button {
    min-width: 42px;
    min-height: 42px;
  }
}

@media (max-width: 720px) {
  .dots {
    display: none;
  }
}

@media (max-width: 360px) {
  footer {
    gap: 4px;
    padding-left: max(6px, env(safe-area-inset-left, 0px));
    padding-right: max(6px, env(safe-area-inset-right, 0px));
  }

  footer button {
    min-width: 34px;
    min-height: 36px;
    padding: 0 6px;
    font-size: 13px;
  }

  #scrub {
    min-width: 36px;
  }
}

/* —— 竖屏：舞台按 1280:720 铺满屏宽并限高，讲稿在下方独立滚动 —— */
@media (max-width: 900px) and (orientation: portrait) {
  .app {
    grid-template-rows: auto auto minmax(0, 1fr) auto;
  }

  main {
    aspect-ratio: 1280 / 720;
    width: 100%;
    max-height: 46dvh;
  }

  aside {
    grid-column: 1;
    grid-row: 3;
    min-height: 0;
    border-left: none;
    border-top: 1px solid var(--line);
    padding: 14px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px));
    overscroll-behavior: contain;
    scroll-padding-bottom: 16px;
  }

  .app.no-notes {
    grid-template-rows: auto minmax(0, 1fr) auto;
  }

  .app.no-notes main {
    aspect-ratio: auto;
    max-height: none;
  }

  .app.no-notes footer {
    grid-row: 3;
  }
}

/* —— 横屏：舞台独占中部全空间，讲稿改为底部抽屉 —— */
@media (max-width: 900px) and (orientation: landscape), (max-height: 520px) and (orientation: landscape) {
  .app,
  .app.no-notes {
    grid-template-rows: auto minmax(0, 1fr) auto;
  }

  header {
    min-height: 36px;
    padding-top: max(4px, env(safe-area-inset-top, 0px));
    padding-bottom: 4px;
  }

  footer {
    min-height: 42px;
    padding-top: 4px;
    padding-bottom: max(4px, env(safe-area-inset-bottom, 0px));
  }

  footer button {
    min-height: 34px;
  }

  aside {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    top: auto;
    z-index: 20;
    max-height: 76vh;
    max-height: 76dvh;
    border-left: none;
    border-top: 1px solid var(--line);
    border-radius: 14px 14px 0 0;
    box-shadow: 0 -10px 28px rgba(31, 30, 29, 0.2);
    padding: 14px max(18px, env(safe-area-inset-right, 0px)) max(20px, env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px));
    overscroll-behavior: contain;
    scroll-padding-bottom: 20px;
    transform: translateY(105%);
    transition: transform 0.25s ease;
  }

  .app:not(.no-notes) aside {
    transform: translateY(0);
    display: block;
    pointer-events: auto;
  }

  .app.no-notes aside {
    display: block;
    pointer-events: none;
    visibility: hidden;
  }

  #notesBackdrop {
    display: block;
    position: fixed;
    inset: 0;
    z-index: 15;
    background: rgba(31, 30, 29, 0.32);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }

  .app:not(.no-notes) #notesBackdrop {
    opacity: 1;
    pointer-events: auto;
  }
}
</style>
</head>
<body>
<div class="app" id="app">
  <header><span class="mark">✻</span><h1>FER 人脸表情识别 · 项目讲解</h1><span class="chap" id="chapName"></span></header>
  <main id="main"><div class="stage" id="stage"></div></main>
  <aside id="notes" aria-live="polite"></aside>
  <footer>
    <button id="prev" aria-label="上一章">←</button>
    <button id="play" aria-label="暂停或播放">❚❚</button>
    <button id="replay" aria-label="重播本章">↺</button>
    <button id="next" aria-label="下一章">→</button>
    <input id="scrub" type="range" min="0" max="1000" value="0" aria-label="本章进度">
    <div class="dots" id="dots"></div>
    <button id="toggleNotes" aria-label="显示或隐藏讲稿">讲稿</button>
    <span class="hint">← → 换章 · 空格 暂停 · R 重播 · N 讲稿</span>
  </footer>
</div>

    $("#chapName").textContent = `${i + 1} / ${scenesData.length} · ${n.t}`;
  }

  function go(i) {
    cur = (i + scenes.length) % scenes.length;

    scenes.forEach((s, k) => s.classList.toggle("on", k === cur));
    $$(".dots button").forEach((b, k) => b.classList.toggle("on", k === cur));

    tl.eventCallback("onUpdate", () => { scrub.value = Math.round(tl.progress() * 1000); });

    toggleBtn.setAttribute("aria-expanded", String(open));
